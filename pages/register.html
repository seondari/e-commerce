<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Toko Kita</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/layout.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">Toko Kita</a>
    <ul>
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="products.html">Produk</a></li>
      <li><a href="cart.html">Keranjang</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <main class="container">
    <form id="register-form" class="form-box">
      <h2>Daftar Akun</h2>
      <label for="name">Nama</label>
      <input type="text" id="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <label for="confirm">Konfirmasi Password</label>
      <input type="password" id="confirm" required>
      <button type="submit" class="btn">Daftar</button>
      <p id="form-msg" class="form-msg"></p>
      <p class="form-alt">Sudah punya akun? <a href="login.html">Login</a></p>
    </form>
  </main>

  <footer>&copy; 2026 E-commerce - Tugas Pemrograman Web</footer>

  <script src="../js/auth.js"></script>
</body>
</html>
